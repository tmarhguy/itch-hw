<!-- Shared docinfo: injected into every generated page by Asciidoctor.
     Keep project-agnostic: no hardcoded project names here.
     Expects the build to copy docs/theme/ next to the HTML output so
     that relative paths theme/docs.css, theme/nav.js, theme/search.js
     resolve (see scripts/build-docs.sh). -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4e89">
<link rel="stylesheet" href="theme/docs.css">
<script src="theme/nav.js" defer></script>
<script src="theme/search.js" defer></script>
